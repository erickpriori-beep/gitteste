<!DOCTYPE html>
<html lang="pt-br" data-theme="escuro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaIA — Plataforma de Estudo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SELETOR DE TEMA (flutuante) -->
    <div class="tema-picker" id="tema-picker">
        <span class="tema-picker-icone">🎨</span>
        <div class="tema-separador"></div>
        <button class="tema-btn tema-escuro ativo" id="btn-escuro" onclick="setTema('escuro')" title="Escuro — Vermelho">
            <div class="tema-dot"></div>
            <span>Escuro</span>
        </button>
        <button class="tema-btn tema-claro" id="btn-claro" onclick="setTema('claro')" title="Claro — Azul">
            <div class="tema-dot"></div>
            <span>Claro</span>
        </button>
        <button class="tema-btn tema-cinza" id="btn-cinza" onclick="setTema('cinza')" title="Cinza">
            <div class="tema-dot"></div>
            <span>Cinza</span>
        </button>
    </div>

    <div class="container">

        <!-- SEÇÃO 1: LOGIN E REGISTRO -->
        <div id="secao-auth">
            <div class="auth-hero">
                <div class="logo-badge">
                    <div class="logo-icon">🎓</div>
                    <span class="logo-text">EducaIA</span>
                </div>
                <div class="auth-slogan">Aprenda mais. Evolua sempre.</div>
            </div>

            <h1 id="titulo-auth">Bem-vindo de volta</h1>
            <p id="subtitulo-auth">Faça login para continuar sua jornada</p>

            <div class="divider"></div>

            <div class="campo">
                <label>Usuário</label>
                <input type="text" id="usuario" placeholder="Ex: ze_gamer" autocomplete="username">
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') autenticar()">
            </div>
            <button onclick="autenticar()" id="btn-auth">Entrar na conta</button>
            <div class="opcoes-nav">
                <span id="msg-troca">Não tem conta? <a onclick="alternarTela(false)">Registre-se grátis</a></span>
            </div>

            <div class="auth-features">
                <div class="auth-feature-item">📐 Matemática</div>
                <div class="auth-feature-item">⚡ Física</div>
                <div class="auth-feature-item">🧪 Química</div>
                <div class="auth-feature-item">📜 História</div>
                <div class="auth-feature-item">🌿 Biologia</div>
            </div>
        </div>

        <!-- SEÇÃO 2: SELEÇÃO DE CURSO -->
        <div id="secao-curso" class="hidden">
            <div class="logo-badge">
                <div class="logo-icon">📚</div>
                <span class="logo-text">EducaIA</span>
            </div>
            <h2>Área de Estudos</h2>
            <span id="boas-vindas"></span>

            <div class="campo">
                <label>Matéria</label>
                <select id="materia">
                    <option value="matematica">📐 Matemática</option>
                    <option value="fisica">⚡ Física</option>
                    <option value="quimica">🧪 Química</option>
                    <option value="historia">📜 História</option>
                    <option value="biologia">🌿 Biologia</option>
                </select>
            </div>

            <div class="campo">
                <label>Nível de Dificuldade</label>
                <select id="nivel">
                    <option value="iniciante">🟢 Iniciante</option>
                    <option value="intermediario">🟡 Intermediário</option>
                    <option value="avancado">🔴 Avançado</option>
                </select>
            </div>

            <button onclick="carregarAula()">Iniciar Lição →</button>
        </div>

        <!-- SEÇÃO 3: QUESTÃO -->
        <div id="secao-aula" class="hidden">
            <div class="aula-header">
                <span id="titulo-aula"></span>
                <span id="contador-questao" class="badge-contador"></span>
            </div>

            <div class="progresso-wrap">
                <div class="progresso-bar-bg">
                    <div class="progresso-bar" id="barra-progresso" style="width:0%"></div>
                </div>
                <span class="progresso-label" id="label-progresso">0 acertos</span>
            </div>

            <div id="conteudo-aula"></div>

            <div class="secao-resposta">
                <label>Sua Resposta</label>
                <div class="input-resposta-wrap">
                    <input
                        type="text"
                        id="input-resposta"
                        placeholder="Digite sua resposta aqui..."
                        oninput="verificarRespostaEmTempoReal()"
                        onkeydown="if(event.key==='Enter') verificarResposta()"
                    >
                    <button class="btn-verificar btn-confirmar" id="btn-verificar" onclick="verificarResposta()">Verificar</button>
                </div>
                <div id="feedback"></div>
            </div>

            <button id="btn-proxima" class="btn-proxima hidden" onclick="proximaQuestao()">Próxima Questão →</button>
            <button onclick="voltar()" class="btn-voltar">← Voltar ao Menu</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
